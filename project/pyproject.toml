[project]
name = "healthy-day-codex-lab"
version = "0.1.0"
description = "Codex 실습용 건강한하루 시작 프로젝트"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "streamlit>=1.45,<2",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1,<2",
    "groq>=0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
